[package]
name = "janus-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
janus-engine = { path = "../janus-engine" }
janus-mod-imggen = { path = "../janus-mod-imggen" }
janus-mod-instruct = { path = "../janus-mod-instruct" }
janus-mod-knowledge = { path = "../janus-mod-knowledge" }
janus-mod-lora = { path = "../janus-mod-lora" }
janus-router = { path = "../janus-router" }
janus-mod-rp = { path = "../janus-mod-rp" }
janus-mod-tts = { path = "../janus-mod-tts" }
janus-mod-vecmem = { path = "../janus-mod-vecmem" }
janus-mod-vision = { path = "../janus-mod-vision" }
janus-mod-vismem = { path = "../janus-mod-vismem" }
janus-mod-voice = { path = "../janus-mod-voice" }
clap = { version = "=4.5.55", features = ["derive"] }

# Web server
axum.workspace = true 
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["fs", "trace"] }

# Async runtime
tokio.workspace = true
tokio-stream = "0.1"
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# UUID generation
uuid = { version = "1.22", features = ["v4"] }

# GPU compute
wgpu.workspace = true

[workspace]
members = [
    "crates/janus-api",
    "crates/janus-engine",
    "crates/janus-router",
    "crates/janus-server",
    "crates/plugins/janus-instruct-plugin",
    "crates/plugins/janus-roleplay-plugin",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Janus Contributors"]
license = "LGPL-3.0-or-later"
repository = "https://github.com/yourusername/janus-engine"

[workspace.dependencies]
# FFI Safety - ABI-stable plugin interface
abi_stable = "0.11.3"

# Compute backend - WGPU for cross-platform GPU compute
wgpu = "29"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"

# Core async runtime
tokio = { version = "1.50", features = ["full"] }
futures = "0.3.32"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Bitflags for capability flags
bitflags = "2.11"

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# HTTP server
axum = "0.8.8"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["fs", "trace"] }

# Logging and tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Binary parsing for GGUF
memmap2 = "0.9.10"
byteorder = "1.5.0"

# Numerics
half = "2.7.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1  # Some optimization for dev builds to keep inference reasonable

[workspace]
members = [
    "crates/janus-engine",
    "crates/janus-server",
    "crates/janus-mod-imggen",
    "crates/janus-mod-ground",
    "crates/janus-mod-instruct",
    "crates/janus-mod-knowledge",
    "crates/janus-mod-lora",
    "crates/janus-router",
    "crates/janus-mod-rp",
    "crates/janus-mod-tts",
    "crates/janus-mod-vecmem",
    "crates/janus-mod-vision",
    "crates/janus-mod-vismem",
    "crates/janus-mod-voice",
]

resolver = "2"

[workspace.lints.clippy]
# Enforce strict error handling - deny unwrap/expect in production code
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
indexing_slicing = "warn"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Janus Contributors"]
license = "LGPL-3.0-or-later"
repository = "https://github.com/yourusername/janus-engine"

[workspace.dependencies]
# Common dependencies shared across crates
wgpu = "29"
tokio = { version = "1.50", features = ["full"] }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
thiserror = "2.0.18"
axum = "0.8.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1  # Some optimization for dev builds to keep inference reasonable
